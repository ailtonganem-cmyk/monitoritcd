# Orca ADE - MonitorITCD
# HML canônico: painel http://127.0.0.1:8765 (+ emuladores Firebase)

scripts:
  setup: bash scripts/orca-worktree-setup.sh
  archive: bash scripts/orca-worktree-archive.sh
defaultTabs:
- title: painel
  command: .venv/bin/python -m monitoritcd.main painel --host 127.0.0.1 --port 8765
  color: '#4ade80'
- title: testes
  command: .venv/bin/python -m pytest -q
  color: '#38bdf8'
- title: lint
  command: .venv/bin/python -m ruff check .
  color: '#a78bfa'
- title: emuladores
  command: firebase emulators:start --project demo-monitoritcd --only firestore,storage,ui
  color: '#f59e0b'
worktree:
  sharedDirectories:
  - .venv
