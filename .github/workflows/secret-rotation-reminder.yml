name: Lembrete de rotacao de secrets

on:
  schedule:
    # Todo dia 1 do mes, 11:00 UTC = 08:00 BRT (apos cron diario)
    - cron: '0 11 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Compute secrets aging
        id: age
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Lista secrets do repo com data de criacao
          SECRETS=$(gh secret list --repo ${{ github.repository }} --json name,updatedAt)
          echo "$SECRETS" > /tmp/secrets.json

          # Calcula idade em dias
          python3 <<'EOF' >> $GITHUB_OUTPUT
          import json
          from datetime import datetime, timezone

          with open('/tmp/secrets.json') as f:
              secrets = json.load(f)

          now = datetime.now(timezone.utc)
          old_secrets = []
          for s in secrets:
              updated = datetime.fromisoformat(s['updatedAt'].replace('Z', '+00:00'))
              age_days = (now - updated).days
              if age_days >= 90:
                  old_secrets.append((s['name'], age_days))

          old_secrets.sort(key=lambda x: -x[1])
          print(f"old_count={len(old_secrets)}")
          # Multi-line output
          print("aged_secrets<<DELIM")
          for name, age in old_secrets:
              print(f"  - {name}: {age} dias")
          print("DELIM")
          EOF

      - name: Send Telegram reminder
        if: steps.age.outputs.old_count != '0'
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
        run: |
          MSG="*MonitorITCD - Lembrete mensal de rotacao*

          Os seguintes secrets tem >= 90 dias de idade e devem ser rotacionados:

          ${{ steps.age.outputs.aged_secrets }}

          Procedimento: ver RUNBOOKS\\.md secao 'Rotacionar secret'\\.
          Apos rotacionar, o contador reinicia automaticamente\\."

          # Escapa MarkdownV2 manualmente nos chars criticos
          ESCAPED=$(echo "$MSG" | sed -e 's/\\./\\\\./g' -e 's/-/\\-/g' -e 's/=/\\=/g' \
                                        -e 's/(/\\(/g' -e 's/)/\\)/g' -e 's/!/\\!/g')

          curl -sS -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "$(python3 -c "import json,sys,os; print(json.dumps({'chat_id':int(os.environ['CHAT']),'text':sys.argv[1],'parse_mode':'MarkdownV2'}))" "$ESCAPED")"

      - name: All fresh - log only
        if: steps.age.outputs.old_count == '0'
        run: echo "Todos secrets sao recentes (<90d). Nenhum lembrete enviado."
