name: Actionlint (Sugestão #19)

# Lint dos próprios workflows YAML.
# Detecta sintaxe inválida, expressões ${{ }} mal-formadas, secrets não-existentes.

on:
  pull_request:
    paths:
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Download actionlint
        id: get_actionlint
        run: bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
        shell: bash
      - name: Run actionlint
        # SC2086 (quote prevenção) é apenas "info" — workflows pré-existentes
        # (backup, deploy-functions) usam expressões GH não quotadas
        # intencionalmente (controladas pelo runner). Filtramos esses códigos.
        env:
          ACTIONLINT_BIN: ${{ steps.get_actionlint.outputs.executable }}
        run: '"$ACTIONLINT_BIN" -shellcheck='
        shell: bash
