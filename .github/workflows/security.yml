name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'  # segunda-feira 06:17 UTC (semanal)
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ───────────────────────────────────────────────────────────────────────
  # SAST — Static Application Security Testing
  # ───────────────────────────────────────────────────────────────────────
  sast:
    name: SAST (bandit + ruff -S)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install "bandit[toml]>=1.7.8" "ruff==0.16.5"

      - name: Bandit (HIGH/MEDIUM bloqueia)
        run: bandit -c pyproject.toml -r src/ -ll

      - name: Ruff security rules
        run: ruff check . --select S

  # ───────────────────────────────────────────────────────────────────────
  # SECRETS — busca em todo histórico
  # ───────────────────────────────────────────────────────────────────────
  secrets:
    name: Secret scanning (gitleaks + detect-secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history para gitleaks

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install detect-secrets
        run: pip install "detect-secrets==1.5.0"

      - name: Detect-secrets vs baseline
        run: |
          # O hook compara todos os arquivos rastreados com o baseline e falha
          # diante de qualquer achado novo. `audit` serve para classificação
          # interativa do baseline e não é um gate de CI.
          git ls-files -z | xargs -0 -- detect-secrets-hook --baseline .secrets.baseline

      - name: Block known secret literals
        run: |
          # Princípio canônico 3: literais conhecidos = commit rejeitado
          git ls-files -z | xargs -0 -- python scripts/check_secret_literals.py

  # ───────────────────────────────────────────────────────────────────────
  # DEPENDENCIES — vulnerabilidades em deps
  # ───────────────────────────────────────────────────────────────────────
  deps:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install pip-audit + project
        run: |
          python -m pip install --upgrade pip "setuptools>=83"
          python -m pip install "pip-audit>=2.7.0"
          python -m pip install -e ".[dev]"

      - name: pip-audit (HIGH/CRITICAL bloqueia)
        # Vulns ignoradas (todas em deps transitivas fora do nosso controle):
        # - CVE-2026-3219: pip da imagem ubuntu-latest
        # - PYSEC-2022-42969: lib `py` (dep transitiva), em funcao SVN nao usada
        # Lista deve ser revisada a cada 90 dias.
        run: |
          pip-audit --strict --vulnerability-service osv \
            --ignore-vuln CVE-2026-3219 \
            --ignore-vuln PYSEC-2022-42969 \
            --ignore-vuln GHSA-4xh5-x5gv-qwph \
            --ignore-vuln PYSEC-2025-49

  # ───────────────────────────────────────────────────────────────────────
  # Sugestão #38: lint semântico dos YAMLs em sources/
  # ───────────────────────────────────────────────────────────────────────
  yaml-semantic-lint:
    name: YAML semantic lint (sources/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Lint sources/*.yaml
        run: python scripts/lint_sources_yaml.py

  # ───────────────────────────────────────────────────────────────────────
  # SBOM — Software Bill of Materials
  # ───────────────────────────────────────────────────────────────────────
  sbom:
    name: Generate SBOM (CycloneDX)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: |
          pip install cyclonedx-bom
          pip install -e .

      - name: Generate SBOM
        run: cyclonedx-py environment --output-file sbom.json

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json
          retention-days: 90
