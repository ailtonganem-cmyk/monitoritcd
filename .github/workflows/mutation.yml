name: Mutation testing (semanal)

# Mutation testing roda em cron semanal — caro demais (~60min) para
# PRs/push. Foco em módulos críticos definidos em [tool.mutmut] do
# pyproject.toml (filters, dedup, security, notifiers/severity).
#
# Trigger automático: domingo 04:00 UTC (= sábado 01:00 BRT).
# Trigger manual: workflow_dispatch (qualquer momento).

on:
  schedule:
    - cron: '0 4 * * 0'  # domingo 04:00 UTC, sem colisão com outros workflows
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: false  # mutation runs longas; nao cancelar a anterior por engano

jobs:
  mutation:
    name: Mutmut (filters + dedup + security)
    runs-on: ubuntu-latest
    timeout-minutes: 90  # buffer sobre os ~60min esperados
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Mutmut run
        run: |
          # Paths e runner vem de [tool.mutmut] em pyproject.toml.
          # `|| true` garante que falhas individuais nao travam o report.
          mutmut run || true
          mutmut results > mutmut-results.txt
          echo '## Mutation Results' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -50 mutmut-results.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-results
          path: |
            mutmut-results.txt
            mutants/
          retention-days: 30
          if-no-files-found: ignore
