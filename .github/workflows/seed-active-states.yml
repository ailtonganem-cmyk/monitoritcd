name: Seed UFs ativas (admin)

on:
  workflow_dispatch:
    inputs:
      ufs:
        description: "UFs a ativar (espaço-separadas, ex: MG)"
        type: string
        default: "MG"
      federal_active:
        description: "Coletar fontes federais"
        type: boolean
        default: true
      dry_run:
        description: "Apenas mostra o diff (não salva)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Configurar credenciais GCP
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          chmod 600 "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: Seed
        env:
          OWNER_ID: ${{ secrets.OWNER_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          INPUT_UFS: ${{ github.event.inputs.ufs }}
          INPUT_FEDERAL_ACTIVE: ${{ github.event.inputs.federal_active }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          read -ra UFS <<< "$INPUT_UFS"
          ARGS=(--ufs "${UFS[@]}" --federal-active "$INPUT_FEDERAL_ACTIVE")
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          python scripts/seed_active_states.py "${ARGS[@]}"
