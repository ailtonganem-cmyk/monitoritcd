name: Backup mensal

on:
  schedule:
    - cron: '7 4 1 * *'  # dia 1 de cada mês, 04:07 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install age (apt)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y age

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run backup
        env:
          OWNER_ID: ${{ secrets.OWNER_ID }}
          AGE_PUBLIC_KEY: ${{ secrets.AGE_PUBLIC_KEY }}
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
        run: |
          # Materializa service account temporariamente
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}' > /tmp/sa.json
          BACKUP_NAME="backup-$(date -u +%Y-%m).json.gz.age"
          python scripts/backup.py --output "$BACKUP_NAME"
          echo "BACKUP_NAME=$BACKUP_NAME" >> $GITHUB_ENV
          # Limpa SA do disco imediatamente após uso
          rm -f /tmp/sa.json

      - name: Upload to Drive (rclone)
        if: env.GDRIVE_FOLDER_ID != ''
        env:
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          RCLONE_CONFIG: ${{ secrets.RCLONE_CONFIG }}
        run: |
          # rclone com config em env var (avoid disk write)
          curl https://rclone.org/install.sh | sudo bash
          mkdir -p ~/.config/rclone
          echo "${RCLONE_CONFIG}" > ~/.config/rclone/rclone.conf
          rclone copy "$BACKUP_NAME" "drive:Backups/MonitorITCD/" -v
          rm -f ~/.config/rclone/rclone.conf

      - name: Upload as artifact (fallback)
        if: always() && env.BACKUP_NAME != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BACKUP_NAME }}
          path: ${{ env.BACKUP_NAME }}
          retention-days: 90
          if-no-files-found: warn
