name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ───────────────────────────────────────────────────────────────────────
  # Lint & format
  # ───────────────────────────────────────────────────────────────────────
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install ruff
        run: pip install "ruff>=0.4.0"
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .

  # ───────────────────────────────────────────────────────────────────────
  # Type check
  # ───────────────────────────────────────────────────────────────────────
  type-check:
    name: mypy --strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Mypy
        run: mypy

  # ───────────────────────────────────────────────────────────────────────
  # Unit + Integration tests
  # ───────────────────────────────────────────────────────────────────────
  test:
    name: Pytest (unit + integration + security)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests with coverage
        run: |
          pytest \
            --cov=src/monitoritcd \
            --cov-branch \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=95
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          retention-days: 30

  # Mutation testing roda em workflow proprio (.github/workflows/mutation.yml)
  # com cron semanal — caro demais (~60min) para PRs/push.
