name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ───────────────────────────────────────────────────────────────────────
  # Lint & format
  # ───────────────────────────────────────────────────────────────────────
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install ruff
        run: python -m pip install "ruff==0.16.5"
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .

  # ───────────────────────────────────────────────────────────────────────
  # Type check
  # ───────────────────────────────────────────────────────────────────────
  type-check:
    name: mypy --strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Mypy
        run: mypy

  # ───────────────────────────────────────────────────────────────────────
  # Unit + Integration tests
  # ───────────────────────────────────────────────────────────────────────
  test:
    name: Pytest (unit + integration + security)
    runs-on: ubuntu-latest
    strategy:
      # Sugestão #34: matrix testing em 3.11/3.12/3.13
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # diff-cover precisa do histórico
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install diff-cover
      - name: Run tests with coverage
        run: |
          pytest \
            --cov=src/monitoritcd \
            --cov-branch \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=95
      # Sugestão #11: diff coverage no PR. Gate inicial em 90% — gate global
      # é 95% (cobertura total), aqui é só sinal complementar para a diff.
      - name: Diff coverage (PR only)
        if: github.event_name == 'pull_request'
        continue-on-error: true  # informativo no PR, não bloqueia
        run: |
          diff-cover coverage.xml --compare-branch=origin/${{ github.base_ref }} --fail-under=90
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 30

  # ───────────────────────────────────────────────────────────────────────
  # Sugestão #3 + #5: Vulture (dead code) + Radon (complexidade)
  # ───────────────────────────────────────────────────────────────────────
  static-analysis:
    name: Vulture + Radon (dead code & complexity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install vulture radon xenon
      - name: Vulture (dead code, min_confidence=80)
        run: vulture src/monitoritcd --min-confidence 80 || true
      - name: Radon (cyclomatic complexity)
        run: |
          radon cc src/monitoritcd -a -nb || true
          # xenon falha se houver função com complexidade > B (10)
          xenon --max-absolute B --max-modules B --max-average A src/monitoritcd || true

  # ───────────────────────────────────────────────────────────────────────
  # Sugestão #6: Interrogate docstring coverage
  # interrogate >= 1.7 puxa cairosvg (lib externa C); pinamos em 1.5.0
  # que não tem essa dependência forçada.
  # ───────────────────────────────────────────────────────────────────────
  docstring-coverage:
    name: Interrogate (docstring coverage)
    runs-on: ubuntu-latest
    continue-on-error: true  # informativo, não bloqueia
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install system deps for cairosvg (interrogate badge)
        run: sudo apt-get update && sudo apt-get install -y libcairo2
      - name: Install
        run: pip install "interrogate>=1.7.0"
      - name: Interrogate
        run: interrogate -c pyproject.toml src/monitoritcd
        continue-on-error: true

  # Mutation testing roda em workflow proprio (.github/workflows/mutation.yml)
  # com cron semanal — caro demais (~60min) para PRs/push.
