name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install lint e testes de tooling
        run: python -m pip install "ruff==0.16.5" "pytest>=8.2.0" "pytest-asyncio>=0.23.0"
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Testes de tooling
        run: pytest tests/unit/test_ci_test_shards.py
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/painel/package-lock.json
      - name: Build do painel (piso T3 [build]; é o que o Hosting publica)
        run: npm ci --prefix apps/painel && npm --prefix apps/painel run build

  type-check:
    name: mypy --strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Mypy
        run: mypy

  test:
    name: Pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install diff-cover
      - name: Validar e preparar shards
        env:
          TOTAL_SHARDS: 3
        run: |
          python scripts/ci_test_shards.py --total "$TOTAL_SHARDS" --resumo
          for indice in $(seq 1 "$TOTAL_SHARDS"); do
            python scripts/ci_test_shards.py \
              --total "$TOTAL_SHARDS" \
              --indice "$indice" \
              > "$RUNNER_TEMP/testes-shard-$indice.txt"
          done
      - name: Executar shards paralelos
        run: |
          mkdir -p "$RUNNER_TEMP/cobertura" "$RUNNER_TEMP/logs" "$RUNNER_TEMP/cache-pytest"
          pids=()
          for indice in 1 2 3; do
            (
              mapfile -t arquivos_teste < "$RUNNER_TEMP/testes-shard-$indice.txt"
              export COVERAGE_FILE="$RUNNER_TEMP/cobertura/.coverage"
              python -m coverage run --parallel-mode -m pytest \
                -o "cache_dir=$RUNNER_TEMP/cache-pytest/shard-$indice" \
                "${arquivos_teste[@]}" \
                > "$RUNNER_TEMP/logs/shard-$indice.log" 2>&1
            ) &
            pids+=("$!")
          done

          resultado=0
          for posicao in 0 1 2; do
            indice=$((posicao + 1))
            if wait "${pids[$posicao]}"; then
              estado=0
            else
              estado=$?
              resultado=1
            fi
            echo "Shard $indice: exit $estado"
            tail -n 30 "$RUNNER_TEMP/logs/shard-$indice.log"
            if [ "$estado" -ne 0 ]; then
              cat "$RUNNER_TEMP/logs/shard-$indice.log"
            fi
          done
          exit "$resultado"
      - name: Piso de cobertura 95% desta versão
        env:
          COVERAGE_FILE: ${{ runner.temp }}/cobertura/.coverage
        run: |
          python -m coverage combine "$RUNNER_TEMP/cobertura"
          python -m coverage report --fail-under=95
          python -m coverage xml -o coverage.xml
      - name: Diff coverage (PR, informativo)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          diff-cover coverage.xml --compare-branch=origin/${{ github.base_ref }} --fail-under=90
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: error
          retention-days: 30
