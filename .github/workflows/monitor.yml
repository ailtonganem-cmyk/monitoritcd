name: Monitor (cron diário)

on:
  schedule:
    # Três crons espalhados: GitHub Actions pode pular schedule em alta carga.
    # Pipeline idempotente (content_hash) — run extra não duplica notificação.
    # 02:33 UTC = 23:33 BRT — janela de baixa carga global.
    - cron: '33 2 * * *'
    # 10:13 UTC = 07:13 BRT — manhã; minuto não-redondo.
    - cron: '13 10 * * *'
    # 14:47 UTC = 11:47 BRT — meio-dia.
    - cron: '47 14 * * *'
    # Watchdog (mesmo workflow, job filtrado): detecta cron do Monitor pulado.
    - cron: '23 6 * * *'
    - cron: '37 13 * * *'
    - cron: '53 21 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Modo dry-run (não persiste/notifica)'
        type: boolean
        default: false
      source_id:
        description: 'Apenas uma fonte (ex: lexml-federal)'
        type: string
        default: ''
      uf:
        description: 'Apenas uma UF (ex: SP)'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: monitor-cron
  cancel-in-progress: false

jobs:
  monitor:
    name: Cron diário
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.schedule == '33 2 * * *' ||
      github.event.schedule == '13 10 * * *' ||
      github.event.schedule == '47 14 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Configuração compartilhada pelo guard (check-config) e pela execução.
    # Secret inexistente chega como string vazia — o Settings trata "" como
    # ausente e desliga apenas o canal correspondente.
    env:
      OWNER_ID: ${{ secrets.OWNER_ID }}
      OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
      TELEGRAM_GROUP_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}
      TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      HEALTHCHECKS_URL: ${{ secrets.HEALTHCHECKS_URL }}
      # Proxy BR (Cloud Function southamerica-east1) para fontes geo_restricted
      PROXY_BR_URL: ${{ secrets.PROXY_BR_URL }}
      PROXY_BR_TOKEN: ${{ secrets.PROXY_BR_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Healthcheck — start
        if: env.HEALTHCHECKS_URL != ''
        env:
          HEALTHCHECKS_URL: ${{ secrets.HEALTHCHECKS_URL }}
        run: |
          curl -fsS -m 10 "${HEALTHCHECKS_URL}/start" || true

      - name: Configurar credenciais GCP
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          # Escreve service account em arquivo temporário e exporta GOOGLE_APPLICATION_CREDENTIALS
          # google.auth.default() requer caminho de arquivo, não string JSON
          echo "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          chmod 600 "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      # Guard de configuração: falha cedo e legível se faltar credencial
      # ESSENCIAL; canal opcional ausente (e-mail) vira aviso na aba Actions.
      # 25 execuções falharam de forma idêntica por 13 dias sem ninguém notar.
      - name: Verificar configuração (canais e credenciais essenciais)
        run: python -m monitoritcd.main check-config

      - name: Run pipeline
        run: |
          # Com PROXY_BR_URL configurado, fontes geo_restricted (ex: ALMG)
          # fazem fallback automatico via Cloud Function southamerica-east1.
          # Sem proxy, BaseCollector levanta ConnectTimeout e fonte falha
          # isolada. Worker local Windows continua disponivel como reserva.
          ARGS="run"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ -n "${{ github.event.inputs.source_id }}" ]; then
            ARGS="$ARGS --source-id ${{ github.event.inputs.source_id }}"
          fi
          if [ -n "${{ github.event.inputs.uf }}" ]; then
            ARGS="$ARGS --uf ${{ github.event.inputs.uf }}"
          fi
          python -m monitoritcd.main $ARGS

      - name: Healthcheck — success ping (se job passou)
        if: success() && env.HEALTHCHECKS_URL != ''
        env:
          HEALTHCHECKS_URL: ${{ secrets.HEALTHCHECKS_URL }}
        run: |
          curl -fsS -m 10 "${HEALTHCHECKS_URL}" || true

      - name: Healthcheck — fail ping (se job falhou)
        if: failure() && env.HEALTHCHECKS_URL != ''
        env:
          HEALTHCHECKS_URL: ${{ secrets.HEALTHCHECKS_URL }}
        run: |
          curl -fsS -m 10 "${HEALTHCHECKS_URL}/fail" || true

  watchdog:
    name: Verificar última coleta
    if: >
      github.event_name == 'schedule' && (
        github.event.schedule == '23 6 * * *' ||
        github.event.schedule == '37 13 * * *' ||
        github.event.schedule == '53 21 * * *'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Verificar último run bem-sucedido do Monitor
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          THRESHOLD_HOURS: '18'
        run: |
          set -euo pipefail
          # Só conta o job "Cron diário" em sucesso. Run só-watchdog (job
          # skipped) NÃO pode renovar o threshold.
          LAST_SUCCESS=""
          while read -r run_id; do
            [ -z "$run_id" ] && continue
            started=$(gh run view "$run_id" --json jobs --jq \
              '[.jobs[] | select(.name=="Cron diário" and .conclusion=="success") | .startedAt] | .[0] // empty')
            if [ -n "$started" ]; then
              LAST_SUCCESS=$started
              break
            fi
          done < <(gh run list --workflow="Monitor (cron diário)" --limit=30 --json databaseId --jq '.[].databaseId')

          if [ -z "$LAST_SUCCESS" ]; then
            echo "alert=true" >> "$GITHUB_OUTPUT"
            echo "reason=nenhum job Cron diário bem-sucedido no histórico recente" >> "$GITHUB_OUTPUT"
            echo "last_success=nunca" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          NOW_EPOCH=$(date -u +%s)
          LAST_EPOCH=$(date -u -d "$LAST_SUCCESS" +%s)
          DELTA_HOURS=$(( (NOW_EPOCH - LAST_EPOCH) / 3600 ))
          echo "Último sucesso do job Cron diário: $LAST_SUCCESS"
          echo "delta_hours=$DELTA_HOURS" >> "$GITHUB_OUTPUT"
          echo "last_success=$LAST_SUCCESS" >> "$GITHUB_OUTPUT"

          if [ "$DELTA_HOURS" -ge "$THRESHOLD_HOURS" ]; then
            echo "alert=true" >> "$GITHUB_OUTPUT"
            echo "reason=último Cron diário há ${DELTA_HOURS}h (threshold: ${THRESHOLD_HOURS}h)" >> "$GITHUB_OUTPUT"
          else
            echo "alert=false" >> "$GITHUB_OUTPUT"
            echo "reason=ok" >> "$GITHUB_OUTPUT"
          fi

      - name: Alertar via Telegram (se cron pulado)
        if: steps.check.outputs.alert == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
          REASON: ${{ steps.check.outputs.reason }}
          LAST_SUCCESS: ${{ steps.check.outputs.last_success }}
        run: |
          set -euo pipefail
          MSG=$(printf 'ALERTA: cron do Monitor pulado.\nMotivo: %s\nUltimo sucesso: %s\nDisparar: gh workflow run monitor.yml' "$REASON" "$LAST_SUCCESS")
          curl -fsS -m 15 \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_OWNER_CHAT_ID}" \
            --data-urlencode "text=${MSG}" \
            > /dev/null

      - name: Pingar /fail no Healthchecks.io (se cron pulado)
        if: steps.check.outputs.alert == 'true'
        env:
          HEALTHCHECKS_URL: ${{ secrets.HEALTHCHECKS_URL }}
        run: |
          if [ -n "${HEALTHCHECKS_URL}" ]; then
            curl -fsS -m 10 "${HEALTHCHECKS_URL}/fail" || true
          fi
