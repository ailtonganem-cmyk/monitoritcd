name: Deploy Cloud Functions
run-name: Deploy Cloud Functions · ${{ inputs.sha }} · @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      sha:
        description: SHA completo de main, já aprovado por Tests e Security
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  deploy-proxy-br:
    name: Deploy proxy_br (southamerica-east1)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validar CI verde do SHA candidato
        env:
          CANDIDATE_SHA: ${{ inputs.sha }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "O workflow de produção deve ser executado a partir de main."
            exit 1
          fi
          if [[ ! "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Informe o SHA completo de 40 caracteres."
            exit 1
          fi

          main_sha="$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$CANDIDATE_SHA" != "$main_sha" ]]; then
            echo "Candidato $CANDIDATE_SHA não é o HEAD atual de main ($main_sha)."
            exit 1
          fi

          for workflow in tests.yml security.yml; do
            run_record="$(
              gh api --method GET \
                "repos/$REPOSITORY/actions/workflows/$workflow/runs" \
                -f branch=main \
                -f event=push \
                -f head_sha="$CANDIDATE_SHA" \
                -F per_page=100 \
                --jq '.workflow_runs | sort_by(.updated_at) | last |
                  [.status, .conclusion, (.id // ""), (.html_url // "")] | @tsv'
            )"
            IFS=$'\t' read -r status conclusion run_id run_url <<< "$run_record"
            if [[ "$status" != "completed" || "$conclusion" != "success" ]]; then
              echo "Gate recusado: $workflow no SHA $CANDIDATE_SHA está ${status:-ausente}/${conclusion:-sem conclusão}."
              exit 1
            fi
            echo "$workflow aprovado no run $run_id: $run_url"
          done

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false

      - name: Confirmar checkout do candidato
        env:
          CANDIDATE_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          if [[ "$checked_out_sha" != "$CANDIDATE_SHA" ]]; then
            echo "Checkout divergente: esperado $CANDIDATE_SHA, obtido $checked_out_sha."
            exit 1
          fi

      - name: Setup gcloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Habilitar APIs necessarias
        env:
          PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          set -euo pipefail

          # Cloud Functions Gen2 = Cloud Run subjacente + Artifact Registry
          gcloud services enable \
            cloudfunctions.googleapis.com \
            cloudbuild.googleapis.com \
            artifactregistry.googleapis.com \
            run.googleapis.com \
            eventarc.googleapis.com \
            --project="$PROJECT_ID" 2>&1 | tee "$RUNNER_TEMP/enable.log"

          # Detecta se erro foi por falta de billing (requer plano Blaze)
          if grep -q "BILLING_DISABLED\|requires billing" "$RUNNER_TEMP/enable.log"; then
            echo ""
            echo "===================================================="
            echo "BILLING REQUIRED: este projeto Firebase precisa estar"
            echo "no plano Blaze (pay-as-you-go) para deploy de Cloud"
            echo "Functions Gen2."
            echo ""
            echo "Acoes manuais (impossivel automatizar):"
            echo "1. https://console.firebase.google.com/project/$PROJECT_ID/usage/details"
            echo "2. Modify plan -> Blaze"
            echo "3. Confirme cartao de credito"
            echo "4. Re-dispare este workflow"
            echo "===================================================="
            exit 1
          fi

      - name: Deploy proxy_br
        env:
          PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          PROXY_TOKEN: ${{ secrets.PROXY_BR_TOKEN }}
        run: |
          set -euo pipefail

          gcloud functions deploy proxy_br \
            --gen2 \
            --runtime=python311 \
            --region=southamerica-east1 \
            --source=functions/proxy_br \
            --entry-point=proxy_br \
            --trigger-http \
            --allow-unauthenticated \
            --memory=256MB \
            --timeout=60s \
            --max-instances=10 \
            --set-env-vars="PROXY_TOKEN=$PROXY_TOKEN" \
            --project="$PROJECT_ID"

      - name: Deploy canary_filter
        env:
          PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FILTER_TOKEN: ${{ secrets.CANARY_FILTER_TOKEN }}
          TG_BOT: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
        run: |
          set -euo pipefail

          gcloud functions deploy canary_filter \
            --gen2 \
            --runtime=python311 \
            --region=southamerica-east1 \
            --source=functions/canary_filter \
            --entry-point=canary_filter \
            --trigger-http \
            --allow-unauthenticated \
            --memory=256MB \
            --timeout=30s \
            --max-instances=5 \
            --set-env-vars="FILTER_TOKEN=$FILTER_TOKEN,TELEGRAM_BOT_TOKEN=$TG_BOT,TELEGRAM_OWNER_CHAT_ID=$TG_CHAT" \
            --project="$PROJECT_ID"

      - name: Preparar fonte imutável do bot_webhook
        env:
          CANDIDATE_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          python scripts/prepare_bot_webhook_source.py \
            --sha "$CANDIDATE_SHA" \
            --output "$RUNNER_TEMP/bot-webhook-source"

      - name: Deploy bot_webhook
        env:
          PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
        run: |
          set -euo pipefail

          # O staging incorpora o pacote monitoritcd do checkout exato aprovado.
          # Em Cloud Function: usa Application Default Credentials (metadata),
          # sem precisar de FIREBASE_SERVICE_ACCOUNT_JSON multilinhas.
          # Usar --env-vars-file pra evitar problemas com chars especiais nos values
          env_file="$RUNNER_TEMP/bot-webhook-env.yaml"
          cleanup_env_file() {
            if [[ -f "$env_file" ]]; then
              shred -u "$env_file" 2>/dev/null || rm -f "$env_file"
            fi
          }
          trap cleanup_env_file EXIT

          cat > "$env_file" <<EOY
          OWNER_ID: "$OWNER_ID"
          OWNER_EMAIL: "$OWNER_EMAIL"
          GEMINI_API_KEY: "$GEMINI_API_KEY"
          GMAIL_USER: "$GMAIL_USER"
          GMAIL_APP_PASSWORD: "$GMAIL_APP_PASSWORD"
          TELEGRAM_BOT_TOKEN: "$TELEGRAM_BOT_TOKEN"
          TELEGRAM_OWNER_CHAT_ID: "$TELEGRAM_OWNER_CHAT_ID"
          TELEGRAM_WEBHOOK_SECRET: "$TELEGRAM_WEBHOOK_SECRET"
          FIREBASE_PROJECT_ID: "$PROJECT_ID"
          FIREBASE_STORAGE_BUCKET: "$FIREBASE_STORAGE_BUCKET"
          EOY

          gcloud functions deploy bot_webhook \
            --gen2 \
            --runtime=python311 \
            --region=southamerica-east1 \
            --source="$RUNNER_TEMP/bot-webhook-source" \
            --entry-point=bot_webhook \
            --trigger-http \
            --allow-unauthenticated \
            --memory=512MB \
            --timeout=60s \
            --max-instances=3 \
            --env-vars-file="$env_file" \
            --project="$PROJECT_ID"

      - name: Verificar Functions publicadas
        env:
          PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          for fn in proxy_br canary_filter bot_webhook; do
            uri="$(
              gcloud functions describe "$fn" \
                --gen2 \
                --region=southamerica-east1 \
                --project="$PROJECT_ID" \
                --format='value(serviceConfig.uri)'
            )"
            if [[ -z "$uri" ]]; then
              echo "Function $fn sem URI publicada."
              exit 1
            fi
            echo "$fn: $uri"
          done
