name: Deploy Cloud Functions

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  deploy-proxy-br:
    name: Deploy proxy_br (southamerica-east1)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Configurar credenciais GCP
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          chmod 600 "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: Setup gcloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Habilitar APIs necessarias
        env:
          PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          # Cloud Functions Gen2 = Cloud Run subjacente + Artifact Registry
          gcloud services enable \
            cloudfunctions.googleapis.com \
            cloudbuild.googleapis.com \
            artifactregistry.googleapis.com \
            run.googleapis.com \
            eventarc.googleapis.com \
            --project=$PROJECT_ID 2>&1 | tee /tmp/enable.log

          # Detecta se erro foi por falta de billing (requer plano Blaze)
          if grep -q "BILLING_DISABLED\|requires billing" /tmp/enable.log; then
            echo ""
            echo "===================================================="
            echo "BILLING REQUIRED: este projeto Firebase precisa estar"
            echo "no plano Blaze (pay-as-you-go) para deploy de Cloud"
            echo "Functions Gen2."
            echo ""
            echo "Acoes manuais (impossivel automatizar):"
            echo "1. https://console.firebase.google.com/project/$PROJECT_ID/usage/details"
            echo "2. Modify plan -> Blaze"
            echo "3. Confirme cartao de credito"
            echo "4. Re-dispare este workflow"
            echo "===================================================="
            exit 1
          fi

      - name: Deploy proxy_br
        env:
          PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          PROXY_TOKEN: ${{ secrets.PROXY_BR_TOKEN }}
        run: |
          gcloud functions deploy proxy_br \
            --gen2 \
            --runtime=python311 \
            --region=southamerica-east1 \
            --source=functions/proxy_br \
            --entry-point=proxy_br \
            --trigger-http \
            --allow-unauthenticated \
            --memory=256MB \
            --timeout=60s \
            --max-instances=10 \
            --set-env-vars=PROXY_TOKEN=$PROXY_TOKEN \
            --project=$PROJECT_ID

      - name: Deploy canary_filter
        env:
          PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FILTER_TOKEN: ${{ secrets.CANARY_FILTER_TOKEN }}
          TG_BOT: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
        run: |
          gcloud functions deploy canary_filter \
            --gen2 \
            --runtime=python311 \
            --region=southamerica-east1 \
            --source=functions/canary_filter \
            --entry-point=canary_filter \
            --trigger-http \
            --allow-unauthenticated \
            --memory=256MB \
            --timeout=30s \
            --max-instances=5 \
            --set-env-vars=FILTER_TOKEN=$FILTER_TOKEN,TELEGRAM_BOT_TOKEN=$TG_BOT,TELEGRAM_OWNER_CHAT_ID=$TG_CHAT \
            --project=$PROJECT_ID

      - name: Deploy bot_webhook
        env:
          PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
        run: |
          # Bot webhook reusa todo o pacote monitoritcd (instalado via git+https)
          # Em Cloud Function: usa Application Default Credentials (metadata),
          # sem precisar de FIREBASE_SERVICE_ACCOUNT_JSON multilinhas.
          # Usar --env-vars-file pra evitar problemas com chars especiais nos values
          cat > /tmp/env.yaml <<EOY
          OWNER_ID: "$OWNER_ID"
          OWNER_EMAIL: "$OWNER_EMAIL"
          GEMINI_API_KEY: "$GEMINI_API_KEY"
          GMAIL_USER: "$GMAIL_USER"
          GMAIL_APP_PASSWORD: "$GMAIL_APP_PASSWORD"
          TELEGRAM_BOT_TOKEN: "$TELEGRAM_BOT_TOKEN"
          TELEGRAM_OWNER_CHAT_ID: "$TELEGRAM_OWNER_CHAT_ID"
          TELEGRAM_WEBHOOK_SECRET: "$TELEGRAM_WEBHOOK_SECRET"
          FIREBASE_PROJECT_ID: "$PROJECT_ID"
          FIREBASE_STORAGE_BUCKET: "$FIREBASE_STORAGE_BUCKET"
          EOY

          gcloud functions deploy bot_webhook \
            --gen2 \
            --runtime=python311 \
            --region=southamerica-east1 \
            --source=functions/bot_webhook \
            --entry-point=bot_webhook \
            --trigger-http \
            --allow-unauthenticated \
            --memory=512MB \
            --timeout=60s \
            --max-instances=3 \
            --env-vars-file=/tmp/env.yaml \
            --project=$PROJECT_ID

          # V9 (Pentest): apaga env.yaml com secrets do runner imediatamente
          # após deploy. Defense-in-depth contra runner comprometido /
          # leak via cache. `shred -u` sobrescreve antes de unlink.
          shred -u /tmp/env.yaml 2>/dev/null || rm -f /tmp/env.yaml

      - name: Print URLs
        env:
          PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          for fn in proxy_br canary_filter bot_webhook; do
            echo "$fn:"
            gcloud functions describe $fn \
              --gen2 --region=southamerica-east1 --project=$PROJECT_ID \
              --format='value(serviceConfig.uri)' 2>/dev/null || echo "  (not deployed)"
          done
