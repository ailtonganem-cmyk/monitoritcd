name: Dashboard (GitHub Pages)

on:
  schedule:
    # 30 min apos o cron diario (ja terao novos dados)
    - cron: '43 10 * * *'
  workflow_dispatch:
  # workflow_run removido (zizmor dangerous-triggers): o cron acima já roda 30 min após o Monitor.

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Install
        run: |
          pip install --upgrade pip
          pip install -e .

      - name: Build dashboard
        env:
          OWNER_ID: ${{ secrets.OWNER_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          umask 077
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/sa.json
          python scripts/build_dashboard.py \
            --output docs/dashboard/index.html \
            --metrics-json docs/dashboard/metrics.json
          rm -f /tmp/sa.json

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: docs/dashboard

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
