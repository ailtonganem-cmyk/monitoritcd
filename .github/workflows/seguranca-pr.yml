# Proposta de segurança v3 (§9 CI por PR) — Semgrep, OSV, gitleaks, Trivy mitigado, zizmor, actionlint.
# Runners hospedados descartáveis; nenhum segredo; Actions e imagens por SHA/digest (Renovate).
name: Segurança (PR)

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '30 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seguranca-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: zizmor (auditoria dos workflows)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          advanced-security: false
          persona: regular

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: actionlint (imagem por digest)
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color -shellcheck=  # mesma política do actionlint.yml existente

  semgrep:
    name: Semgrep (dono do SAST, D-03)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: semgrep/semgrep:1.181.0@sha256:81474464c1f07483ba0682a44787fd93c91397419762a04abe2bafaae396304b
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Semgrep --error (regras fixadas; nunca --config auto)
        run: semgrep scan --config p/default --error --metrics=off

  osv:
    name: OSV-Scanner (SCA)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: OSV-Scanner (exit 128 = sem pacotes = não verificado = reprova)
        run: docker run --rm -v "$PWD:/src" -w /src ghcr.io/google/osv-scanner:v2.7.0@sha256:4f3b7e2c64b9d38a5febc5a7e4a3dfef1d1362f726dea7a2ef4762b46469fcd0 scan source -r /src

  gitleaks:
    name: gitleaks (segredos no histórico)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks --redact (nunca imprime segredo)
        run: docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git --redact --no-banner -v /repo

  trivy:
    name: Trivy mitigado (SHA + cosign, sem segredos, runner descartável)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      TRIVY_VERSION: "0.76.0"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Baixar Trivy e verificar assinatura cosign (fail-closed)
        run: |
          set -euo pipefail
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          tgz="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSLO "$base/$tgz"
          curl -fsSLO "$base/$tgz.sigstore.json"
          cosign verify-blob "$tgz" --bundle "$tgz.sigstore.json" \
            --certificate-identity-regexp '^https://github\.com/aquasecurity/trivy/\.github/workflows/reusable-release\.yaml@refs/tags/v' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          mkdir -p "$RUNNER_TEMP/trivy" && tar -xzf "$tgz" -C "$RUNNER_TEMP/trivy" trivy
          echo "$RUNNER_TEMP/trivy" >> "$GITHUB_PATH"
      - name: Trivy fs (vuln,misconfig; segredos ficam com gitleaks/trufflehog)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: true
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  seguranca-ok:
    name: Agregador de segurança (fail-closed; job pulado reprova)
    if: always()
    needs: [zizmor, semgrep, osv, gitleaks, trivy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Conferir resultados
        env:
          RESULTADOS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTADOS" | python3 -c 'import json,sys; n=json.load(sys.stdin); bad={k:v["result"] for k,v in n.items() if v["result"]!="success"}; print(bad or "todos verdes"); sys.exit(1 if bad else 0)'
