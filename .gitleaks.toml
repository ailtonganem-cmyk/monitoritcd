# MonitorITCD — gitleaks config
# Estende a config padrão e adiciona allowlist para fixtures de teste
# que contêm padrões intencionalmente parecidos com secrets para validar
# o redator de logs.

[extend]
useDefault = true

[allowlist]
description = "Fixtures de teste do redactor de logs"
# Caminhos com fakes intencionais (auditados manualmente)
paths = [
    '''tests/security/test_log_redactor\.py''',
    '''tests/unit/test_bot_poller\.py''',         # smoke test do pipeline de redacao
    '''scripts/check_secret_literals\.py''',     # patterns de detecção (não secrets)
    '''functions/canary_filter/test_main\.py''', # fixture de payload canarytokens.org
    # legacy_aws_loader.py: honeytoken removido em 2026-04-26 (ver SECURITY.md T8 DESATIVADO)
    '''CLAUDE\.md''',                            # docs mencionam prefixos
    '''SECURITY\.md''',
    '''IDEAS\.md''',
    '''\.pre-commit-config\.yaml''',             # patterns no hook
    '''\.gitleaks\.toml''',                      # esta própria config
    '''^\.secrets\.baseline$''',                 # hashes do baseline detect-secrets, não credenciais
]
# Strings literais que aparecem em docs ou testes — incluindo tokens de
# honeytokens DESATIVADOS (T8 SECURITY.md). Esses tokens existem no histórico
# Git mas serão invalidados em canarytokens.org pelo dono (Camada 2 do
# runbook docs/runbooks/canarytoken_emails.md). Após invalidação, ficam
# sem valor — exposição no histórico aceita.
regexes = [
    '''AKIAIOSFODNN7EXAMPLE''',                  # exemplo oficial AWS
    # Honeytoken AWS desativado (commit f7956e8 em diante):
    '''AKIA2OPXAUXXTGQEYZYT''',                  # access key canary (invalidada)
    '''lsXXbNp\+oR2SqknYev2CT9TaH7NBwaimHAEdL8Zo''',  # secret canary (invalidada)
    # Token identificador do canarytoken (fixture em test, não é credencial):
    '''wbvsademg2des6xd1my49aixf''',
    '''-----BEGIN [A-Z ]*PRIVATE KEY-----''',    # marcador, não chave real (em docs)
]
