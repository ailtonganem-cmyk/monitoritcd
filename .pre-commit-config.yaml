# Pre-commit hooks — princípio canônico 3 do CLAUDE.md:
# Secrets PROIBIDOS em código fonte. Sem exceção. Sem --no-verify.
#
# Para instalar:
#   pip install pre-commit
#   pre-commit install
#   pre-commit install --hook-type commit-msg
#   pre-commit run --all-files  # primeira execução

default_language_version:
  python: python3.11

repos:
  # ─────────────────────────────────────────────────────────────────────────
  # Sanidade básica
  # ─────────────────────────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-symlinks
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  # ─────────────────────────────────────────────────────────────────────────
  # SECRETS — bloqueio absoluto
  # ─────────────────────────────────────────────────────────────────────────
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: |
          (?x)^(
            \.secrets\.baseline$|
            poetry\.lock$|
            uv\.lock$|
            tests/cassettes/.*
          )$

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks

  # Bloqueio determinístico de literais conhecidos (princípio canônico 3)
  - repo: local
    hooks:
      - id: block-known-secret-literals
        name: "Block known secret literal prefixes (sk_live_, sk_test_, whsec_, AIza, ya29, ghp_, etc.)"
        entry: python scripts/check_secret_literals.py
        language: python
        pass_filenames: true
        types_or: [python, yaml, json, toml, markdown, text]
        exclude: |
          (?x)^(
            \.secrets\.baseline$|
            scripts/check_secret_literals\.py$|
            CLAUDE\.md$|
            IDEAS\.md$|
            \.pre-commit-config\.yaml$
          )$

  # ─────────────────────────────────────────────────────────────────────────
  # Lint & format (Ruff)
  # ─────────────────────────────────────────────────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.10
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # ─────────────────────────────────────────────────────────────────────────
  # SAST (Bandit)
  # ─────────────────────────────────────────────────────────────────────────
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.9
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml", "-r", "src/"]
        additional_dependencies: ["bandit[toml]"]
        files: ^src/

  # ─────────────────────────────────────────────────────────────────────────
  # Type check (Mypy) — apenas em módulos críticos
  # ─────────────────────────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        files: ^src/monitoritcd/(core|filters|notifiers|security|storage|bot)/
        additional_dependencies:
          - "pydantic>=2.7.0"
          - "pydantic-settings>=2.2.0"
          - "structlog>=24.1.0"
          - "types-bleach"
          - "types-PyYAML"

  # ─────────────────────────────────────────────────────────────────────────
  # YAML lint para sources/ (esquema do domínio)
  # ─────────────────────────────────────────────────────────────────────────
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        files: ^(sources|config)/.*\.ya?ml$
        args: [-d, "{extends: default, rules: {line-length: {max: 120}}}"]

ci:
  autofix_commit_msg: "chore(pre-commit): auto-fixes"
  autoupdate_commit_msg: "chore(pre-commit): autoupdate hooks"
  skip: [mypy]  # mypy é pesado; roda em CI próprio
