notas: |
  TJMG — MG mantém alíquota fixa de 5% sobre ITCMD.
  Disputas comuns: base de cálculo (valor de mercado vs valor venal).

  Feed RSS oficial `/data/rss/noticiasTJMG.xml` (RSS 2.0, ~50 notícias).

  geo_restricted=true:
  - GH Actions runner US: HTTP 403 (geo-block do tribunal).
  - proxy_br (southamerica-east1): também 403 — bloqueia IPs cloud
    (validado 2026-04-27, não só geo).
  - Único caminho: worker local Windows com `--only-geo-restricted`
    (scripts/install_local_monitor_task.ps1).

  Reativada 2026-05-09: YAML ativo para o worker local coletar.
  Em GH Actions falha isolada (try/except por fonte) sem derrubar
  pipeline. Se worker local off, MG segue coberto por
  almg-proposicoes/legislacao/sefaz-mg/doe-mg via proxy_br.
