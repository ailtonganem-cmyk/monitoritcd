notas: |
  Diário Oficial Eletrônico de MG (Jornal Minas Gerais).
  Reescrita 2026-05-19: substitui generic_html anterior (que era SPA-blind
  contra o site Angular). Agora consome API REST .NET diretamente.

  Pipeline: POST /api/v1/Autenticacao/Autenticar (JWT anônimo) →
  GET /Jornal/ObterUltimaEdicaoECalendarioParaHome (id do dia) →
  GET /Jornal/ObterEdicaoPorId/{id} (seções por órgão) →
  GET /Caderno/ObterArquivoCadernoPorId?id={id} com Bearer (PKCS#7 envelope)
  → base64 decode → busca %PDF-/%%EOF → pypdf → regex de atos.

  Filtra atos que mencionem SEFAZ-MG (qualquer variação em org_mentions),
  independente de relacionar a ITCD/sucessões/regime_bens (keywords_bypass=true).
  Volume típico: ~30-50 atos/dia que mencionam SEFAZ no Executivo.
