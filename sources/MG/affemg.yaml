notas: |
  AFFEMG — Associação dos Funcionários Fiscais do Estado de Minas Gerais.

  Validada 2026-05-12 via curl direto (HTTP 200, sem geo-block):
  - Listagem HTML estática em `/blog`.
  - Itens: `<a class="blog-post-card w-inline-block" href="/blog/SLUG">
    <h5/h6>TÍTULO</h5></a>`. URLs são relativas, prefixar com domínio.
  - Cobertura: alta no que toca carreira fazendária, ICMS-MG, ITCD-MG,
    Reforma Tributária (IBS/CBS/EC 132) e pareceres técnicos de auditores
    fiscais. Volume moderado (~30/mês).
