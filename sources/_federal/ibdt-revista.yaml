id: ibdt-revista
uf: _federal
nome: "IBDT — Revista Direito Tributário Atual (RDTA)"
tipo: doutrina
parser: generic_html
url: "https://revista.ibdt.org.br/index.php/RDTA/issue/archive"
keywords_required:
  - ITCMD
  - ITCD
  - ITD
  - "causa mortis"
  - "doação"
  - sucessão
  - "planejamento sucessório"
  - "planejamento tributário"
  - "holding familiar"
