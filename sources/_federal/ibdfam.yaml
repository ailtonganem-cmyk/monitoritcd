notas: |
  IBDFAM — referência em Direito de Família e Sucessões.

  Reativada 2026-05-09: feed RSS não existe (validado), mas listagem HTML
  em `/noticias` retorna 200 com 10 notícias por página no padrão
  `<div class="news"><div class="data">DD/MM/YYYY</div><a>Título</a>...</div>`.
  Cobertura excelente para sucessões/regime de bens (notícias com TST/STF/STJ
  e TJs estaduais). Confiabilidade alta — IBDFAM seleciona o que publicar.
