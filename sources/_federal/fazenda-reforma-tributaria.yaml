notas: |
  Ministério da Fazenda — página oficial de Reforma Tributária (Plone CMS).

  Criada 2026-05-12 sem validação local (US runner recebe HTTP 403).
  `geo_restricted: true` força fallback via proxy_br southamerica-east1.

  Plone CMS padrão (mesmo da Receita Federal): `h2.titulo > a` ou
  `article.tileItem`. Selectors mistos para robustez.

  Cobertura: comunicados oficiais sobre Reforma Tributária do Consumo,
  Comitê Gestor do IBS, regulamentações de IBS/CBS/IS, e seus impactos
  colaterais em ITCD (EC 132 alterou art. 155 da CF).
