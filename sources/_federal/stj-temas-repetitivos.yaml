notas: |
  STJ — Temas de Recursos Repetitivos (JSP em processo.stj.jus.br).

  Criada 2026-05-12. Curl HEAD retorna 200 mas GET reseta conexão SSL
  (Cloudflare geo-block). `geo_restricted: true` força fallback via
  proxy_br southamerica-east1.

  Selectors heurísticos para JSP padrão (`table.dados`, `div.tema`).
  fragile=true; revisar primeiro run com proxy e ajustar.

  Cobertura crítica: teses vinculantes do STJ em RR (Tema 1093 ITCD
  renúncia, Tema 1.214 VGBL, Tema 825, Tema 1003, Tema 809, etc.).
  Notícias do STJ via stj.yaml já capturam menções, mas esta fonte
  pega a publicação primária do tema.
