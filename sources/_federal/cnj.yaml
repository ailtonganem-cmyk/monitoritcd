id: cnj-noticias
uf: _federal
nome: "CNJ — Conselho Nacional de Justiça"
tipo: jurisprudencia
parser: generic_html
url: "https://www.cnj.jus.br/category/noticias/"
keywords_required:
  - ITCMD
  - ITCD
  - "causa mortis"
  - "doação"
  - sucessão
  - inventário
  - "extrajudicial"
  - notarial
  - cartório
  - provimento
selectors:
  item: "article.elementor-post"
  titulo: "h3 a"
  link: "h3 a@href"
topics:
  - itcd
  - sucessoes
ativo: true
trusted: true
fragile: true
notas: |
  CNJ — provimentos sobre cartórios, inventários extrajudiciais.
  Relevante via Provimento 56/CNJ e correlatos.

  Reativada 2026-05-09: feed `/feed/` retorna HTML mesmo com Content-Type
  `application/rss+xml` (bug do nginx/Yoast). Usamos parsing HTML em
  `/category/noticias/` — Elementor expõe `article.elementor-post`
  com `h3 a` (10 posts/página).
