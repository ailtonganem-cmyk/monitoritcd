notas: |
  FENAFISCO — Federação Nacional do Fisco Estadual e Distrital.
  Entidade nacional dos auditores fiscais dos 27 entes — cobre todos os
  estados onde a SEFAZ tributa ICMS/ITCD, com foco em Reforma Tributária
  e administração tributária.

  Validada 2026-05-12 via curl direto (HTTP 200, sem geo-block):
  - Listagem HTML estática na raiz `/`.
  - Estrutura: `<article class="listing-item ..."><div class="item-inner">
    <h2 class="title"><a class="post-title post-url" href="ABS_URL">
    TÍTULO</a></h2></div></article>`.
  - URLs absolutas no padrão `/DD/MM/YYYY/slug/`.

  Alto sinal para Reforma Tributária do Consumo (impacto sobre auditores),
  fraude fiscal (Operação Ícaro/SP), PECs em tramitação, e ações políticas
  da federação. Complementa AFFEMG (que é MG-específico) com cobertura
  nacional.
