notas: |
  ANOREG-BR — entidade nacional dos cartórios extrajudiciais; cobre todos
  os ramos (notas, registro civil, RI). Alto sinal para Provimento 56/CNJ,
  inventário extrajudicial, escrituras de doação/testamento, regime de bens.

  Validada 2026-05-12 via curl direto (HTTP 200, sem geo-block):
  - Listagem HTML estática em `/site/noticias/`.
  - Padrão (sic): `<spam class="media-heading link-noticias">
    <a href="https://www.anoreg.org.br/site/SLUG/">TÍTULO</a></spam>`.
  - Note: o HTML usa "spam" (typo do site) em vez de "span"; mantemos
    o seletor literal — fragile=true caso corrijam.
