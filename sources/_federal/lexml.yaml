id: lexml-portal
uf: _federal
nome: "LexML Brasil — Legislação federal e estadual (todos os entes)"
tipo: jurisprudencia
parser: lexml_portal
url: "https://www.lexml.gov.br/busca/search"
selectors:
  palavras_chave: "ITCMD|ITCD|causa mortis|sucessão|inventário|regime de bens"
  tipo_documento: "Legislação"
  # localidades vazio = aceita TODOS os entes (federal + 27 estados)
  localidades: ""
keywords_required:
  - ITCMD
  - ITCD
  - "causa mortis"
  - "causa-mortis"
  - "doação"
  - sucessão
  - inventário
  - espólio
  - "regime de bens"
topics:
  - itcd
  - sucessoes
  - regime_bens
ativo: true
trusted: true
fragile: false
geo_restricted: true
notas: |
  LexML Brasil — fonte canônica federal e estadual de atos normativos.
  Operado pelo Senado Federal, indexa atos de TODOS os 27 entes
  federativos via URNs estruturadas (urn:lex:br;{uf}:{esfera}:...).

  API SRU oficial descontinuada em ~2025 (404). Fonte primária agora é
  o portal HTML em /busca/search, parseado por LexMLPortalCollector.

  geo_restricted=true: servidor lexml.gov.br rejeita IPs Azure US do
  GitHub Actions runner. Fallback automatico via proxy_br BR.
