notas: |
  STF — listagem oficial de Súmulas Vinculantes (ASP clássico).

  Criada 2026-05-12 sem validação local (US runner recebe 403 / cert error).
  `geo_restricted: true` força fallback via Cloud Function proxy_br
  (southamerica-east1) no primeiro run em produção.

  Selectors `div.conteudoTexto p, table tr` são heurísticos (ASP do STF usa
  estrutura mista de div+table). fragile=true; revisar via log do primeiro
  run com proxy_br e ajustar se houver drift ou zero items.

  Cobertura crítica: Súmulas Vinculantes sobre ITCD (alíquota progressiva
  pré-Resolução SF 9, base de cálculo, isenções), legitimação processual
  de herdeiros, regime de bens em união homoafetiva (SV 13 etc.).
