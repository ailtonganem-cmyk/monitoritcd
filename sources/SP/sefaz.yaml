notas: |
  SEFAZ-SP — Portal de legislação tributária (legislacao.fazenda.sp.gov.br).
  Alíquota SP: 4% fixa (Lei 10.705/2000). Discussões ativas sobre progressividade.

  Reativada em 2026-05-09 — usando API SharePoint REST oficial (`/_api/web/lists`):
  - O portal renderiza HTML via JavaScript (parsing estático não traz conteúdo).
  - SharePoint expõe API REST nativa em `/_api/Web/Lists(guid'...')/Items`.
  - Lista canônica: "Páginas" (~27 mil itens; Portarias, Comunicados, RC, etc.).
  - Estratégia: top=100 ordenados por Modified desc, filtro keywords cliente-side
    (SharePoint não filtra campos Note/Calculated server-side).
  - URL final do ato: `File.ServerRelativeUrl` (`/Paginas/Portaria-XXX-de-YYYY.aspx`).

  Validação 2026-05-08: 7 itens ITCMD nos últimos 100 modificados em 1 dia
  (Comunicados DICAR, Respostas a Consulta — RC, Portarias).
