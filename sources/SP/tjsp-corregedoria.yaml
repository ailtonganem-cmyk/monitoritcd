notas: |
  Corregedoria-Geral da Justiça SP — Comunicados (atos administrativos
  da CGJ sobre cartórios, tabelionatos, registro civil e extrajudicial).

  Validado 2026-05-12 via curl direto (US runner, HTTP 200):
  - HTML estático, paginação `?pagina=N` (1 a ~394).
  - Padrão `<div class="comunicado"><h3><a href="/Corregedoria/Comunicados/
    Comunicado?codigoComunicado=XXXX&pagina=1">TÍTULO</a></h3>`.
  - Links relativos; base `https://www.tjsp.jus.br`.

  Alto sinal para inventários extrajudiciais (Provimento 56/CNJ), escrituras
  de doação, testamento público, regime de bens. Volume alto (~30/mês);
  filtro de keywords corta o ruído administrativo.
