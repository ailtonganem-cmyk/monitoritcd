notas: |
  TIT-SP (Tribunal de Impostos e Taxas SP) — órgão administrativo de
  julgamento de tributos estaduais; cobre disputas pré-judiciais ITCMD.

  Pesquisa 2026-05-09:
  - URL antiga (`fazenda.sp.gov.br/tit/`) redireciona para Sobre.aspx.
  - Portal SharePoint expõe `_api/web/lists` mas só tem conteúdo
    administrativo (estoque, câmaras), NÃO decisões/acórdãos.
  - Decisões reais ficam no ePAT — exige login do contribuinte.
  - Sem API pública de jurisprudência TIT-SP.

  Mantida `ativo: false`. Cobertura indireta:
  - sefaz-sp (SharePoint API) traz Comunicados/RC com referência a TIT.
  - jota-principal e conjur-feed (federais) cobrem decisões TIT relevantes.
