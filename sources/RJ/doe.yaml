  DOERJ — Imprensa Oficial RJ.

  Investigação 2026-05-09: URL responde HTTP 200 mas página é homepage
  genérica (sem listagem). Busca avançada e PDFs exigem formulário POST.
  Sem API pública nem dataset estruturado. Mantida inativa.

  Cobertura indireta: LexML federal indexa atos publicados no DOERJ
  por URN urn:lex:br;rj:estadual:..., e SEFAZ-RJ (quando ativada)
  duplicaria os atos administrativos. Reativar se Imprensa RJ
  publicar feed/API pública.
