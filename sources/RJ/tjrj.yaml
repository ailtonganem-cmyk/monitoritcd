id: tjrj-noticias
uf: RJ
nome: "TJRJ — Tribunal de Justiça do RJ (notícias)"
tipo: jurisprudencia
parser: generic_html
url: "https://www.tjrj.jus.br/noticias"
keywords_required:
  - ITD
  - ITCMD
  - ITCD
  - "causa mortis"
  - "doação"
  - sucessão
  - inventário
  - espólio
  - holding
selectors:
  item: "ul.lista-noticias li"
  titulo: "span.data a"
  link: "span.data a@href"
topics:
  - itcd
  - sucessoes
  - regime_bens
ativo: true
trusted: true
fragile: true
geo_restricted: true
notas: |
  TJRJ — RJ adota nomenclatura "ITD". Alíquota progressiva (4-8%).
  Frequente disputa sobre base de cálculo.

  Listagem HTML em `/noticias` retorna 200 com 20 itens recentes
  no padrão `<ul class="lista-noticias"><li><span class="data"><a>...</a>`.

  geo_restricted=true (deploy 2026-05-09): em GH Actions runner US o
  servidor envia headers HTTP duplicados (multiple Transfer-Encoding) que
  httpx/h11 rejeitam com RemoteProtocolError. Localmente do BR funciona
  normalmente. Fallback via proxy_br southamerica-east1 contorna o bug
  (proxy normaliza headers).
  fragile=true: Liferay já mudou layout antes; revisar selectors se 0 items.
