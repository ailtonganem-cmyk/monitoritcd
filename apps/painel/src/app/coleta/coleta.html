<mat-card>
  <mat-card-header>
    <mat-card-title>Executar Coleta</mat-card-title>
  </mat-card-header>
  <mat-card-content class="form-content">
    <mat-form-field>
      <mat-label>Source ID (Opcional)</mat-label>
      <input matInput [(ngModel)]="sourceId" placeholder="ex: mg_iof">
    </mat-form-field>
    
    <mat-checkbox [(ngModel)]="dryRun">Dry Run (não salvar no banco)</mat-checkbox>
    
    <button mat-raised-button color="primary" (click)="coletar()">Disparar Coleta</button>

    <div *ngIf="comando" class="comando-box">
      <p>Comando gerado para execução local ou pipeline:</p>
      <code>{{comando}}</code>
    </div>
  </mat-card-content>
</mat-card>
