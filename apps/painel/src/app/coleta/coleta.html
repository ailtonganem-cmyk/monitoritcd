<mat-card class="coleta-card">
  <mat-card-header>
    <mat-card-title>Executar Coleta</mat-card-title>
  </mat-card-header>
  <mat-card-content class="form-content">
    <mat-form-field>
      <mat-label>Source ID (Opcional)</mat-label>
      <input matInput class="mono" [(ngModel)]="sourceId" placeholder="ex: mg_iof">
    </mat-form-field>
    
    <mat-checkbox [(ngModel)]="dryRun">Dry Run (não salvar no banco)</mat-checkbox>
    
    <button mat-raised-button color="primary" class="btn-coleta" (click)="coletar()">Disparar Coleta</button>

    @if (comando) {
      <div class="comando-box">
        <p class="comando-label">Comando gerado para execução local ou pipeline:</p>
        <code class="mono">{{comando}}</code>
      </div>
    }
  </mat-card-content>
</mat-card>
