<div class="login-container">
  <mat-card>
    <mat-card-header>
      <mat-card-title>MonitorITCD</mat-card-title>
      <mat-card-subtitle>Painel de Controle</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <p>Faça login com sua conta Google (<code>ailtonganem@gmail.com</code>).</p>
      <button
        mat-raised-button
        color="primary"
        type="button"
        [disabled]="googleEmCurso"
        (click)="entrarGoogle()">
        Entrar com Google
      </button>
      @if (hmlLocal) {
        <p>HML localhost: sem client OAuth, use o botão abaixo (não funciona em produção).</p>
        <button mat-raised-button color="primary" type="button" (click)="entrarHml()">
          Entrar local (HML)
        </button>
      }
    </mat-card-content>
  </mat-card>
</div>
